version: "3.8"

services:
  blue:
    image: ${IMAGE_NAME}:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - ConnectionStrings__DbPassword=${ConnectionStrings__DbPassword}
      - RedisServer__RedisCacheConfiguration=${RedisServer__RedisCacheConfiguration}
      - RedisServer__RedisInstanceName=${RedisServer__RedisInstanceName}
      - RedisServer__ConnectionMultiplexer=${RedisServer__ConnectionMultiplexer}
    container_name: ${CONTAINER_PROJECT_NAME}-blue # Now dynamic!
    restart: unless-stopped
    ports:
      - "${BLUE_PORT}:8000"
    networks:
      - grrnet

  green:
    image: ${IMAGE_NAME}:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - ConnectionStrings__DbPassword=${ConnectionStrings__DbPassword}
      - RedisServer__RedisCacheConfiguration=${RedisServer__RedisCacheConfiguration}
      - RedisServer__RedisInstanceName=${RedisServer__RedisInstanceName}
      - RedisServer__ConnectionMultiplexer=${RedisServer__ConnectionMultiplexer}
    container_name: ${CONTAINER_PROJECT_NAME}-green # Now dynamic!
    restart: unless-stopped
    ports:
      - "${GREEN_PORT}:8000"
    networks:
      - grrnet

networks:
  grrnet:
    name: grrnet
    external: true
